
services:
  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: genai-backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: genai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true
    restart: unless-stopped
